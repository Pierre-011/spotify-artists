name: Mise à jour des sorties

on:
  schedule:
    - cron: "30 0 * * *"
      timezone: "Europe/Paris"
    - cron: "30 0 * * *"
      timezone: "Europe/London"
    - cron: "30 0 * * *"
      timezone: "America/New_York"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-releases
  cancel-in-progress: false

jobs:
  update:
    name: Vérifier les sorties musicales
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright

      - name: Installer Chromium pour Playwright
        run: |
          python -m playwright install --with-deps chromium

      - name: Vérifier la structure du dépôt
        run: |
          echo "Répertoire courant : $(pwd)"
          echo "Contenu de data :"
          ls -la data
          echo "Contenu de scripts :"
          ls -la scripts

      - name: Mettre à jour les sorties
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u scripts/update_releases.py

      - name: Vérifier les modifications
        id: changes
        run: |
          if git diff --quiet -- data/sorties.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Aucune modification détectée."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Modification de data/sorties.json détectée."
            git diff --stat -- data/sorties.json
          fi

      - name: Enregistrer les nouvelles sorties
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/sorties.json
          git commit -m "Mise à jour des sorties"
          git push
